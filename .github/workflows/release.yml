# Build and attach the release bundle when a new version is published.
#
# Trigger: publishing a GitHub Release (the "create a new release version"
# action). Editing a draft, pre-releases, or just pushing a tag do NOT build;
# flip the `types` list below if those should too.
#
# The bundle is built on x86_64 Linux (ubuntu-22.04, linux/amd64) and ships BOTH
# execution variants in one self-contained tarball:
#   - vins_adapter        CPU binary (+ its bundled lib/ closure)
#   - vins_adapter_gpu    CUDA binary (+ lib_gpu/, CUDA + OpenCV worker-provided)
#   - run_vins_adapter.sh launcher: GPU by default, CPU fallback / --cpu
# build_vins_adapter.sh produces vins_adapter-linux-x86_64.tar.gz and its
# md5sum-compatible .md5; both are uploaded as assets of the triggering release.
#
# GPU prerequisite (repository secret, set once by a maintainer):
#   OPENCV_CUDA_TARBALL   URL of a .tar.gz holding a CUDA-enabled OpenCV 4.13.0
#                         install (an install prefix containing
#                         OpenCVConfig.cmake, or lib/cmake/opencv4/... and lib/
#                         with the CUDA-enabled .so files). It must be reachable
#                         from the runner (e.g. a GitHub release asset URL or a
#                         pre-signed object-storage URL). The same CUDA + OpenCV
#                         build must be present on GPU workers at run time -- it
#                         is intentionally NOT bundled (see the README "Build
#                         (maintainers)" section). Because a release must always
#                         include both CPU and GPU execution, the workflow fails
#                         fast with a clear message when this secret is missing.
name: Build release

on:
  release:
    types: [published]

permissions:
  contents: write   # required to upload assets to the release

jobs:
  build:
    name: Build x86_64 CPU + GPU bundle
    runs-on: ubuntu-22.04   # x86_64 Linux -> native linux/amd64, no qemu

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          # Build exactly the sources the release points at, not the default
          # branch HEAD (which may have moved on since the release was cut).
          ref: ${{ github.event.release.tag_name }}

      - name: Free up disk space on the runner
        # The image builds ROS1 + VINS-Fusion twice (CPU + GPU workspaces) and
        # copies a full shared-library closure; github runners ship with a lot of
        # unused toolchains that would otherwise crowd the ~14 GB free disk.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Fetch CUDA-enabled OpenCV for the GPU variant
        id: opencv
        env:
          OPENCV_CUDA_TARBALL: ${{ secrets.OPENCV_CUDA_TARBALL }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENCV_CUDA_TARBALL:-}" ]]; then
            echo "::error::OPENCV_CUDA_TARBALL secret is not set." >&2
            echo "::error::A release must include both CPU and GPU execution, but the GPU" >&2
            echo "::error::variant needs a CUDA-enabled OpenCV 4.13.0 install. Add a repo" >&2
            echo "::error::secret OPENCV_CUDA_TARBALL pointing at a .tar.gz of that install." >&2
            exit 1
          fi
          dest="${RUNNER_TEMP}/opencv-cuda"
          mkdir -p "$dest"
          curl -fL --retry 3 -o "${RUNNER_TEMP}/opencv-cuda.tar.gz" "$OPENCV_CUDA_TARBALL"
          tar -xzf "${RUNNER_TEMP}/opencv-cuda.tar.gz" -C "$dest"
          # The tarball holds an OpenCV install prefix (lib/, include/, ...).
          # Locate its OpenCVConfig.cmake, then strip the known cmake suffix to
          # recover the prefix -- that is the directory --opencv-cuda expects
          # (it must contain OpenCVConfig.cmake, lib/cmake/opencv4/... or
          # lib64/cmake/opencv4/..., and lib/ with the CUDA-enabled .so files).
          cfg="$(find "$dest" -name OpenCVConfig.cmake -print -quit)"
          if [[ -z "$cfg" ]]; then
            echo "::error::no OpenCVConfig.cmake in the CUDA OpenCV tarball"
            exit 1
          fi
          case "$cfg" in
            */lib/cmake/opencv4/OpenCVConfig.cmake)   prefix="${cfg%/lib/cmake/opencv4/OpenCVConfig.cmake}" ;;
            */lib64/cmake/opencv4/OpenCVConfig.cmake) prefix="${cfg%/lib64/cmake/opencv4/OpenCVConfig.cmake}" ;;
            *)                                        prefix="$(dirname "$cfg")" ;;
          esac
          if [[ ! -f "$prefix/OpenCVConfig.cmake" \
             && ! -f "$prefix/lib/cmake/opencv4/OpenCVConfig.cmake" \
             && ! -f "$prefix/lib64/cmake/opencv4/OpenCVConfig.cmake" ]]; then
            echo "::error::cannot resolve the OpenCV install prefix from $cfg"
            exit 1
          fi
          echo "path=$prefix" >> "$GITHUB_OUTPUT"
          echo "CUDA-enabled OpenCV staged at: $prefix"

      - name: Build the CPU + GPU bundle
        # build_vins_adapter.sh builds the Docker image (RoboStack ROS1 Noetic +
        # Ceres + OpenCV + VINS-Fusion), copies the binaries out, writes the
        # launcher/BUILDINFO, runs the regression suite, then creates the
        # arch-named tar.gz and its .md5. --opencv-cuda enables the GPU variant,
        # so the bundle carries both vins_adapter and vins_adapter_gpu. The
        # regression suite is kept as a release gate: on a CPU-only runner it
        # exercises the CPU binary via the launcher (the GPU functional test
        # self-skips when the worker-provided CUDA/OpenCV is absent), so a broken
        # bundle fails here instead of being published.
        run: |
          set -euo pipefail
          ./build_vins_adapter.sh \
            --platform linux/amd64 \
            --opencv-cuda "${{ steps.opencv.outputs.path }}"

      - name: Verify the release artifacts
        # Fail the job before publishing if the build did not produce a valid
        # tarball + matching checksum, or if either execution variant is missing.
        run: |
          set -euo pipefail
          tar="vins_adapter-linux-x86_64.tar.gz"
          md5="vins_adapter-linux-x86_64.tar.gz.md5"
          test -s "$tar"
          test -s "$md5"
          md5sum -c "$md5"
          echo "--- execution variants in tarball ---"
          tar -tzf "$tar" | grep -E 'vins_adapter/(vins_adapter|vins_adapter_gpu|run_vins_adapter.sh|BUILDINFO.json)$' | sort
          tar -tzf "$tar" | grep -q 'vins_adapter/vins_adapter$' \
            || { echo "::error::CPU binary vins_adapter is absent"; exit 1; }
          tar -tzf "$tar" | grep -q 'vins_adapter/vins_adapter_gpu$' \
            || { echo "::error::GPU binary vins_adapter_gpu is absent"; exit 1; }
          echo "--- provenance ---"
          cat vins_adapter/BUILDINFO.json
          ls -lh "$tar" "$md5"

      - name: Upload tar.gz and md5 to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # --clobber makes a re-run of the workflow idempotent (replace the
          # assets instead of failing because they already exist).
          gh release upload "$TAG" \
            vins_adapter-linux-x86_64.tar.gz \
            vins_adapter-linux-x86_64.tar.gz.md5 \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Uploaded release assets to $TAG"
